<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Wordclock</title>

    <link rel="stylesheet" href="/style.css">

    <script src="/app.js" defer>
    </script>

</head>

<body>

    <main>

        <header>

            <h1>wordclock.</h1>

            <span id="status">
                Connexion...
            </span>

        </header>

        <section class="clock">

            <div id="time">
                --:--:--
            </div>

        </section>

        <section class="panel">

            <div class="section-header">

                <h2>Thèmes</h2>

                <span id="activeTheme">
                    Chargement...
                </span>

            </div>

            <div id="themeList">

                <p class="muted">
                    Chargement des thèmes...
                </p>

            </div>

        </section>

        <section class="panel">

            <h2>Ambiance</h2>

            <div class="setting">

                <label for="frontColor">
                    Couleur avant
                </label>

                <input type="color" id="frontColor" value="#ffe1b4" disabled>

            </div>

            <div class="harmony-setting">

                <label for="harmony">
                    Harmonie des couleurs
                </label>

                <select id="harmony" disabled>

                    <option value="manual">
                        Indépendante
                    </option>

                    <option value="identical">
                        Identique
                    </option>

                    <option value="complementary">
                        Complémentaire
                    </option>

                    <option value="analogous-plus">
                        Analogique +30°
                    </option>

                    <option value="analogous-minus">
                        Analogique -30°
                    </option>

                    <option value="triadic">
                        Triadique
                    </option>

                </select>

                <p id="harmonyDescription" class="muted">
                </p>

            </div>

            <div class="setting" id="manualRearRow">

                <label for="rearColor">
                    Couleur arrière
                </label>

                <input type="color" id="rearColor" value="#3c64b4" disabled>

            </div>

            <div class="setting" id="automaticRearRow" hidden>

                <div>

                    <span>Couleur arrière</span>

                    <p class="muted">
                        Calculée automatiquement
                    </p>

                </div>

                <div class="color-preview" id="effectiveRearColor">
                </div>

            </div>

            <div class="palette-preview">

                <div id="frontPreview">
                    Avant
                </div>

                <div id="rearPreview">
                    Arrière
                </div>

            </div>

            <div class="separator"></div>

            <div class="setting">

                <label for="brightness">
                    Luminosité
                </label>

                <span id="brightnessValue">
                    3 %
                </span>

            </div>

            <input type="range" id="brightness" min="0" max="255" value="8" disabled>

            <p id="message" role="status"></p>

        </section>

        <footer>
            Wordclock 3.0
        </footer>

    </main>

</body>

</html>
