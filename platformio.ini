[platformio]
default_envs = d1

[env]
platform = espressif8266@4.2.1
board = d1
framework = arduino

monitor_speed = 115200

board_build.filesystem = littlefs

lib_deps =
    fastled/FastLED@3.10.10
    tzapu/WiFiManager@2.0.17
    bblanchon/ArduinoJson@6.21.5

; USB upload

[env:d1]
upload_protocol = esptool
upload_speed = 115200

; Wi-Fi upload

[env:d1_ota]
upload_protocol = espota
upload_port = wordclock.local

upload_flags =
    --port=8266
    --host_port=3232
    --auth=${sysenv.WORDCLOCK_OTA_PASSWORD}
